name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
        
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Debug Build Output
        run: ls -la ./dist

      - name: Copy CNAME after build
        run: cp CNAME dist/ || echo "No CNAME file found"

      # Copy dist to deploy to break hard links
      - name: Prepare deployment directory
        run: cp -r ./dist ./deploy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./deploy  # Upload the deploy directory instead of dist
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:     
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          
      - name: Debug Downloaded Files
        run: ls -la

      - name: Check artifact size
        run: du -sh .
      
      - name: Check for symlinks
        run: find . -type l
      - name: Remove symlinks
        run: find . -type l -delete
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4