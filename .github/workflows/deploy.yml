name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
        
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Debug Build Output
        run: ls -la ./dist

      - name: Move CNAME after build
        run: mv CNAME dist/ || echo "No CNAME file found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist
      
      - name: Debug Downloaded Files
        run: ls -la   # Проверяем, что файлы есть

      - name: Check artifact size
        run: du -sh ./dist

      - name: Clean up unnecessary files
        run: |
          rm -rf ./dist/node_modules
          rm -rf ./dist/.git
          rm -rf ./dist/.cache
      
      - name: Check for symlinks
        run: find ./dist -type l
      - name: Remove symlinks
        run: find ./dist -type l -delete
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
