name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
        
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Debug Build Output
        run: ls -la ./dist

      - name: Move CNAME after build
        run: mv CNAME dist/ || echo "No CNAME file found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: dist-artifact
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: ./dist  # Разархивируем в dist
          pattern: dist-artifact-*

      - name: Debug Downloaded Files
        run: ls -la ./dist  # Проверяем, что файлы есть

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
