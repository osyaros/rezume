name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
        
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Debug Build Output
        run: ls -la ./dist

      - name: Copy CNAME after build
        run: cp CNAME dist/ || echo "No CNAME file found"

      # Улучшенное копирование с разрывом всех ссылок
      - name: Prepare clean deployment directory
        run: |
          mkdir -p deploy
          find ./dist -type f -exec cp -P --parents "{}" ./deploy \;
          echo "Checking links in deploy:"
          find ./deploy -type l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./deploy
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:     
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./deploy-content
          
      - name: Debug Downloaded Files
        run: ls -la ./deploy-content

      - name: Check artifact size
        run: du -sh ./deploy-content
      
      - name: Validate file structure
        run: |
          echo "Checking for symlinks:"
          find ./deploy-content -type l
          echo "Checking for hard links:"
          find ./deploy-content -type f -links +1
          
      - name: Prepare deployment directory
        run: |
          tar -cf dist.tar --hard-dereference ./dist
          mkdir deploy
          tar -xf dist.tar -C ./deploy
          rm dist.tar
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4